name: gestaofabiolucasdev
description: "ERP & Plataforma de Gestão Fábio Lucas Dev"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design & UI Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # Firebase Ecosystem
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_messaging: ^16.1.1
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6

  # Local Notifications
  flutter_local_notifications: ^20.0.0

  # Mídia, Animações e Vetores
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  video_player: ^2.8.6
  cached_network_image: ^3.3.1

  # Geração e Impressão de Documentos / Comprovantes
  pdf: ^3.10.8
  printing: ^5.13.1

  # Utilitários, Roteamento Web e Formatação Brasileira
  intl: ^0.20.3
  url_strategy: ^0.2.0
  brasil_fields: ^1.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  archive: 3.6.1

flutter:
  uses-material-design: true

  assets:
    - src/animation/
    - src/cartoes/
    - src/icones/
    - src/imagens/
    - src/videos/
